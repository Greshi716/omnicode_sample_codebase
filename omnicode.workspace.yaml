# OmniCode Workspace Configuration for Library Lending Sample App
name: omnicode-sample-app
description: "Sample Java Library Lending and Inventory System with Seeded Diagnostic Benchmarks"

repo:
  roots:
    - "."
  source_roots:
    - "src/main/java"
  exclude:
    - ".git"
    - "target"
    - ".omnicode"
    - "eval"

docs_dirs:
  - "README.md"

workflows_dirs:
  - "workflows"

masking:
  org_terms:
    - "LibraryCorp"
    - "BookPlex"
  table_patterns:
    - "^LIB_"
  package_prefixes:
    - "com.example.library"
  allowlist:
    - "java.util"
    - "java.time"
    - "java.math"
    - "java.lang"

onprem:
  url: "http://localhost:11434"
  model: "mistral-small"
  timeout: 60
  max_code_chars: 4000
  max_answer_chars: 2000
  call_budget_per_session: 3
  enabled: true

host:
  timeout_seconds: 120
  disallowed_tools:
    - "Bash"
    - "Read"
    - "Edit"
    - "MultiEdit"
    - "Write"
    - "Glob"
    - "Grep"
    - "WebFetch"
    - "WebSearch"

storage:
  backend: "postgres"
  url_env: "DATABASE_URL"
  sqlite_path: ".omnicode/omnicode_state.db"
